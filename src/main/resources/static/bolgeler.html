<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bölgeler — Bitki Sulama Yönetim Paneli</title>
    <link rel="stylesheet" href="common.css">
</head>
<body>
<header>
    <div class="marka">
        <span class="damla"></span>
        <div><h1>Bitki Sulama Yönetim Paneli</h1></div>
    </div>
    <nav id="navBox"></nav>
    <div id="userBox"></div>
</header>

<main>
    <div class="bolum">
        <h3>Bölgeler</h3>
        <p class="subtitle">Kayıtlı tüm bölgeler. Bölge numarası sistem tarafından otomatik atanır.</p>
        <table>
            <thead>
            <tr><th>Bölge No</th><th>Bölge Adı</th><th>İlçe</th><th>Sulama Alanı</th><th></th></tr>
            </thead>
            <tbody id="regionTable"></tbody>
        </table>
        <div id="regionEmpty" class="bos-durum" style="display:none;">Henüz kayıtlı bölge yok.</div>
    </div>

    <div class="bolum">
        <h3>Yeni Bölge Ekle</h3>
        <p class="subtitle">Bölge numarası sistem tarafından otomatik atanır, girmene gerek yok.</p>
        <div class="form-grid">
            <div><label>İlçe No</label><input id="rDistrictNo" type="number"></div>
            <div><label>İlçe Adı</label><input id="rDistrictName" type="text"></div>
            <div><label>Bölge Adı</label><input id="rRegionName" type="text"></div>
            <div><label>Sulama Alanı No</label><input id="rIrrigationAreaNo" type="number"></div>
            <div><label>Sulama Alanı Adı</label><input id="rIrrigationAreaName" type="text"></div>
            <div class="satir-sonu"><label>Açıklama (opsiyonel)</label><input id="rDescription" type="text"></div>
        </div>
        <button class="btn-ekle" onclick="addRegion()">Bölge Ekle</button>
        <div class="basari-mesaji" id="regionSuccess"></div>
    </div>
</main>

<script src="common.js"></script>
<script>
    requireLogin();
    requireAdmin();
    setupNav('bolgeler.html');
    loadRegions();

    async function loadRegions(){
        const tableBody = document.getElementById('regionTable');
        const emptyNotice = document.getElementById('regionEmpty');
        tableBody.innerHTML = '';
        try{
            const list = await apiCall('/api/region/list');
            if(!list || list.length === 0){
                emptyNotice.style.display = 'block';
                return;
            }
            emptyNotice.style.display = 'none';
            list.forEach(region => {
                const tr = document.createElement('tr');
                tr.innerHTML = `
        <td>#${region.regionNo}</td>
        <td>${region.regionName}</td>
        <td>${region.districtName} (${region.districtNo})</td>
        <td>${region.irrigationAreaName} (${region.irrigationAreaNo})</td>
        <td><button class="btn-sil" data-id="${region.id}" data-ad="${region.regionName}">Sil</button></td>
      `;
                tableBody.appendChild(tr);
            });
            tableBody.querySelectorAll('.btn-sil').forEach(btn => {
                btn.addEventListener('click', () => deleteRegion(btn.dataset.id, btn.dataset.ad));
            });
        } catch(e){
            emptyNotice.textContent = 'Liste yüklenemedi: ' + e.message;
            emptyNotice.style.display = 'block';
        }
    }

    async function deleteRegion(id, name){
        if(!confirm(`"${name}" bölgesini silmek istediğine emin misin?`)) return;
        try{
            await apiCall('/api/region/delete/' + id, {method:'DELETE'});
            loadRegions();
        } catch(e){
            alert('Bölge silinemedi: ' + e.message);
        }
    }

    async function addRegion(){
        const successBox = document.getElementById('regionSuccess');
        successBox.style.display = 'none';
        const body = {
            districtNo: Number(document.getElementById('rDistrictNo').value),
            districtName: document.getElementById('rDistrictName').value.trim(),
            regionName: document.getElementById('rRegionName').value.trim(),
            irrigationAreaNo: Number(document.getElementById('rIrrigationAreaNo').value),
            irrigationAreaName: document.getElementById('rIrrigationAreaName').value.trim(),
            description: document.getElementById('rDescription').value.trim()
        };
        try{
            await apiCall('/api/region/save', {method:'POST', body: JSON.stringify(body)});
            successBox.textContent = 'Bölge başarıyla eklendi.';
            successBox.style.display = 'block';
            ['rDistrictNo','rDistrictName','rRegionName','rIrrigationAreaNo','rIrrigationAreaName','rDescription'].forEach(id => document.getElementById(id).value = '');
            loadRegions();
        } catch(e){
            alert('Bölge eklenemedi: ' + e.message);
        }
    }
</script>
</body>
</html>
