<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Anasayfa — Bitki Sulama Yönetim Paneli</title>
    <link rel="stylesheet" href="common.css">
</head>
<body>
<header>
    <div class="marka">
        <span class="damla"></span>
        <div><h1>Bitki Sulama Yönetim Paneli</h1></div>
    </div>
    <nav id="navKutusu"></nav>
    <div id="kullaniciKutusu"></div>
</header>

<main>
    <div class="bolum">
        <h3>Sulama Cihazları</h3>
        <p class="aciklama">Bölgedeki tüm sulama cihazlarının anlık durumu. Arızalı bir cihaz gördüğünde işaretle.</p>
        <table>
            <thead>
            <tr><th>Bölge</th><th>İlçe</th><th>Cihaz No</th><th>Durum</th><th>Arıza Açıklaması</th><th>İşlemler</th></tr>
            </thead>
            <tbody id="cihazTablosu"></tbody>
        </table>
        <div id="cihazBos" class="bos-durum" style="display:none;">Henüz kayıtlı cihaz yok.</div>
    </div>
</main>

<script src="common.js"></script>
<script>
    girisGerekli();
    navKur('index.html');
    cihazlariYukle();

    async function cihazlariYukle(){
        const govde = document.getElementById('cihazTablosu');
        const bosUyari = document.getElementById('cihazBos');
        govde.innerHTML = '';

        // Giriş yapan kullanıcının rolünü alıyoruz
        const adminMi = getRole() === 'ADMIN';

        try{
            const liste = await apiCagir('/api/genel-tablo/list');
            if(!liste || liste.length === 0){
                bosUyari.style.display = 'block';
                return;
            }
            bosUyari.style.display = 'none';
            liste.forEach(cihaz => {
                const arizaliMi = cihaz.durum === 'ARIZALI';

                // Eğer giren kişi ADMIN ise Çıkar (Sil) butonunu oluştur, BAHÇIVAN ise boş bırak
                const silButonu = adminMi ?
                    `<button class="btn-sil" style="margin-left: 8px;" onclick="cihazSil(${cihaz.id}, ${cihaz.sulamaCihazNo})">Çıkar</button>`
                    : '';

                const tr = document.createElement('tr');
                tr.innerHTML = `
        <td>${cihaz.bolge.bolgeAd}</td>
        <td>${cihaz.bolge.ilceAd}</td>
        <td>#${cihaz.sulamaCihazNo}</td>
        <td><span class="durum-rozet ${cihaz.durum}"><span class="nokta"></span>${arizaliMi ? 'Arızalı' : 'Çalışıyor'}</span></td>
        <td style="color:var(--metin-soluk);font-size:12.5px;">${arizaliMi ? (cihaz.aciklama || '—') : '—'}</td>
        <td>
            <button class="btn-toggle" data-id="${cihaz.id}" data-yenidurum="${arizaliMi ? 'CALISIYOR' : 'ARIZALI'}">
              ${arizaliMi ? 'Çalışıyor İşaretle' : 'Arızalı İşaretle'}
            </button>
            ${silButonu}
        </td>
      `;
                govde.appendChild(tr);
            });

            govde.querySelectorAll('.btn-toggle').forEach(btn => {
                btn.addEventListener('click', () => durumDegistirTiklandi(btn.dataset.id, btn.dataset.yenidurum));
            });
        } catch(e){
            bosUyari.textContent = 'Liste yüklenemedi: ' + e.message;
            bosUyari.style.display = 'block';
        }
    }

    // YENİ EKLENEN ÇIKAR (SİL) FONKSİYONU
    async function cihazSil(id, cihazNo){
        // Silmeden önce kullanıcıdan onay iste
        if(!confirm(`#${cihazNo} numaralı sulama cihazını sistemden ÇIKARMAK istediğine emin misin?`)) return;

        try{
            // Backend'e DELETE isteği atıyoruz
            await apiCagir('/api/genel-tablo/delete/' + id, {method:'DELETE'});
            // Silme başarılıysa listeyi yenile
            cihazlariYukle();
        } catch(e){
            alert('Cihaz çıkarılamadı: ' + e.message);
        }
    }

    function durumDegistirTiklandi(id, yeniDurum){
        let aciklama = '';
        if(yeniDurum === 'ARIZALI'){
            aciklama = prompt('Arıza açıklaması gir (zorunlu):', '');
            if(aciklama === null) return;
            if(aciklama.trim() === ''){
                alert('Arızalı olarak işaretlemek için açıklama girmen gerekiyor.');
                return;
            }
        }
        durumDegistir(id, yeniDurum, aciklama);
    }

    async function durumDegistir(id, yeniDurum, aciklama){
        try{
            await apiCagir('/api/genel-tablo/durum/' + id, {
                method:'PUT',
                body: JSON.stringify({durum: yeniDurum, aciklama: aciklama})
            });
            cihazlariYukle();
        } catch(e){
            alert('Durum güncellenemedi: ' + e.message);
        }
    }
</script>
</body>
</html>
