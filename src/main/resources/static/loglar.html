<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>İşlem Geçmişi — Bitki Sulama Yönetim Paneli</title>
    <link rel="stylesheet" href="common.css">
</head>
<body>
<header>
    <div class="marka">
        <div class="belediye-logo">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path d="M12 2.5C12 2.5 5.5 10.2 5.5 15A6.5 6.5 0 0 0 18.5 15C18.5 10.2 12 2.5 12 2.5Z" fill="#1668A8"/>
                <path d="M9.4 16.3c.9 1.3 2.4 2 3.9 1.8" stroke="#ffffff" stroke-width="1.4" stroke-linecap="round" fill="none" opacity=".85"/>
            </svg>
        </div>
        <div>
            <h1>Bitki Sulama Yönetim Paneli</h1>
            <div class="alt-baslik">Akıllı Park ve Bahçe Sistemleri</div>
        </div>
    </div>
    <nav id="navBox"></nav>
    <div id="userBox"></div>
</header>

<main>
    <div class="bolum">
        <h3>Sistem İşlem Geçmişi (Audit Logs)</h3>
        <p class="subtitle">Sistemdeki cihaz arıza ve onarım kayıtlarını zaman damgasıyla inceleyin.</p>

        <table>
            <thead>
            <tr>
                <th>Tarih / Saat</th>
                <th>Kullanıcı</th>
                <th>İşlem Türü</th>
                <th>Detay</th>
            </tr>
            </thead>
            <tbody id="logTablosu">
            <tr><td colspan="4" class="bos-durum">Loglar yükleniyor...</td></tr>
            </tbody>
        </table>
    </div>
</main>

<script src="common.js"></script>
<script>
    requireLogin();
    requireManager(); 
    setupNav('loglar.html');

    async function loglariYukle() {
        try {
            const logs = await apiCall('/api/logs/list');
            const tbody = document.getElementById('logTablosu');

            if (logs.length === 0) {
                tbody.innerHTML = '<tr><td colspan="4" class="bos-durum">Henüz sistemde kayıtlı bir işlem yok.</td></tr>';
                return;
            }

            tbody.innerHTML = logs.map(log => {
                const tarih = new Date(log.timestamp).toLocaleString('tr-TR');
                return `
                        <tr>
                            <td style="color: var(--metin-soluk); font-size: 12px;">${tarih}</td>
                            <td><strong>${log.username}</strong></td>
                            <td><span class="log-badge">${log.action}</span></td>
                            <td>${log.details}</td>
                        </tr>
                    `;
            }).join('');
        } catch (err) {
            document.getElementById('logTablosu').innerHTML = `<tr><td colspan="4" class="hata-mesaji" style="display:table-cell;">${err.message}</td></tr>`;
        }
    }

    loglariYukle();
</script>
</body>
</html>
