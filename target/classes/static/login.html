<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Giriş — Bitki Sulama Yönetim Paneli</title>
    <link rel="stylesheet" href="common.css">
</head>
<body>
<main class="giris-sayfa">
    <div>
        <div class="giris-marka">
            <div class="belediye-logo">
                <svg width="26" height="26" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path d="M12 2.5C12 2.5 5.5 10.2 5.5 15A6.5 6.5 0 0 0 18.5 15C18.5 10.2 12 2.5 12 2.5Z" fill="#1668A8"/>
                    <path d="M9.4 16.3c.9 1.3 2.4 2 3.9 1.8" stroke="#ffffff" stroke-width="1.4" stroke-linecap="round" fill="none" opacity=".85"/>
                </svg>
            </div>
            <h1>Bitki Sulama Yönetim Paneli</h1>
            <div class="alt-baslik">Akıllı Park ve Bahçe Sistemleri</div>
        </div>

        <div class="giris-kart">
            <h2>Giriş Yap</h2>
            <p>Devam etmek için kullanıcı adı ve şifreni gir.</p>
            <div class="hata-mesaji" id="loginError"></div>
            <label for="loginUsername">Kullanıcı Adı</label>
            <input id="loginUsername" type="text" placeholder="admin">
            <label for="loginPassword">Şifre</label>
            <input id="loginPassword" type="password" placeholder="••••">
            <button class="btn-birincil" onclick="login()">Giriş Yap</button>
            <div class="yardimci-hesaplar">
                Test hesapları — <code>admin / 1234</code> · <code>bahcivan / 1234</code>
            </div>
        </div>
    </div>
</main>

<script src="common.js"></script>
<script>
    // Zaten giriş yapmışsa direkt anasayfaya at
    if(getToken()) window.location.href = 'index.html';

    async function login(){
        const errorBox = document.getElementById('loginError');
        errorBox.style.display = 'none';
        const username = document.getElementById('loginUsername').value.trim();
        const password = document.getElementById('loginPassword').value;
        try{
            const response = await apiCall('/api/auth/login', {
                method:'POST',
                body: JSON.stringify({username, password})
            });
            localStorage.setItem('token', response.token);
            localStorage.setItem('role', response.role);
            localStorage.setItem('username', response.username);
            window.location.href = 'index.html';
        } catch(e){
            errorBox.textContent = 'Giriş başarısız: kullanıcı adı veya şifre hatalı.';
            errorBox.style.display = 'block';
        }
    }

    document.getElementById('loginPassword').addEventListener('keydown', (e) => {
        if(e.key === 'Enter') login();
    });
</script>
</body>
</html>
