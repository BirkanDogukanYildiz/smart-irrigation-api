<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Anasayfa — Bitki Sulama Yönetim Paneli</title>
    <link rel="stylesheet" href="common.css">
</head>
<body>
<header>
    <div class="marka">
        <span class="damla"></span>
        <div><h1>Bitki Sulama Yönetim Paneli</h1></div>
    </div>
    <nav id="navBox"></nav>
    <div id="userBox"></div>
</header>

<main>
    <div class="bolum">
        <h3>Sulama Cihazları</h3>
        <p class="subtitle">Bölgedeki tüm sulama cihazlarının anlık durumu. Arızalı bir cihaz gördüğünde işaretle.</p>
        <table>
            <thead>
            <tr><th>Bölge</th><th>İlçe</th><th>Cihaz No</th><th>Durum</th><th>Arıza Açıklaması</th><th>İşlemler</th></tr>
            </thead>
            <tbody id="deviceTable"></tbody>
        </table>
        <div id="deviceEmpty" class="bos-durum" style="display:none;">Henüz kayıtlı cihaz yok.</div>
    </div>
</main>

<script src="common.js"></script>
<script>
    requireLogin();
    setupNav('index.html');
    loadDevices();

    async function loadDevices(){
        const tableBody = document.getElementById('deviceTable');
        const emptyNotice = document.getElementById('deviceEmpty');
        tableBody.innerHTML = '';

        // Giriş yapan kullanıcının rolünü alıyoruz
        const isAdmin = getRole() === 'ADMIN';

        try{
            const list = await apiCall('/api/devices/list');
            if(!list || list.length === 0){
                emptyNotice.style.display = 'block';
                return;
            }
            emptyNotice.style.display = 'none';
            list.forEach(device => {
                const isFaulty = device.status === 'FAULTY';

                // Eğer giren kişi ADMIN ise Çıkar (Sil) butonunu oluştur, BAHÇIVAN ise boş bırak
                const deleteButton = isAdmin ?
                    `<button class="btn-sil" style="margin-left: 8px;" onclick="deleteDevice(${device.id}, ${device.deviceNo})">Çıkar</button>`
                    : '';

                const tr = document.createElement('tr');
                tr.innerHTML = `
        <td>${device.region.regionName}</td>
        <td>${device.region.districtName}</td>
        <td>#${device.deviceNo}</td>
        <td><span class="durum-rozet ${device.status}"><span class="nokta"></span>${isFaulty ? 'Arızalı' : 'Çalışıyor'}</span></td>
        <td style="color:var(--metin-soluk);font-size:12.5px;">${isFaulty ? (device.description || '—') : '—'}</td>
        <td>
            <button class="btn-toggle" data-id="${device.id}" data-newstatus="${isFaulty ? 'WORKING' : 'FAULTY'}">
              ${isFaulty ? 'Çalışıyor İşaretle' : 'Arızalı İşaretle'}
            </button>
            ${deleteButton}
        </td>
      `;
                tableBody.appendChild(tr);
            });

            tableBody.querySelectorAll('.btn-toggle').forEach(btn => {
                btn.addEventListener('click', () => onStatusToggleClick(btn.dataset.id, btn.dataset.newstatus));
            });
        } catch(e){
            emptyNotice.textContent = 'Liste yüklenemedi: ' + e.message;
            emptyNotice.style.display = 'block';
        }
    }

    // YENİ EKLENEN ÇIKAR (SİL) FONKSİYONU
    async function deleteDevice(id, deviceNo){
        // Silmeden önce kullanıcıdan onay iste
        if(!confirm(`#${deviceNo} numaralı sulama cihazını sistemden ÇIKARMAK istediğine emin misin?`)) return;

        try{
            // Backend'e DELETE isteği atıyoruz
            await apiCall('/api/devices/delete/' + id, {method:'DELETE'});
            // Silme başarılıysa listeyi yenile
            loadDevices();
        } catch(e){
            alert('Cihaz çıkarılamadı: ' + e.message);
        }
    }

    function onStatusToggleClick(id, newStatus){
        let description = '';
        if(newStatus === 'FAULTY'){
            description = prompt('Arıza açıklaması gir (zorunlu):', '');
            if(description === null) return;
            if(description.trim() === ''){
                alert('Arızalı olarak işaretlemek için açıklama girmen gerekiyor.');
                return;
            }
        }
        changeStatus(id, newStatus, description);
    }

    async function changeStatus(id, newStatus, description){
        try{
            await apiCall('/api/devices/status/' + id, {
                method:'PUT',
                body: JSON.stringify({status: newStatus, description: description})
            });
            loadDevices();
        } catch(e){
            alert('Durum güncellenemedi: ' + e.message);
        }
    }
</script>
</body>
</html>
