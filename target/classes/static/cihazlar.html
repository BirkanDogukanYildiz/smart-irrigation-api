<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cihazlar — Bitki Sulama Yönetim Paneli</title>
    <link rel="stylesheet" href="common.css">
</head>
<body>
<header>
    <div class="marka">
        <span class="damla"></span>
        <div><h1>Bitki Sulama Yönetim Paneli</h1></div>
    </div>
    <nav id="navBox"></nav>
    <div id="userBox"></div>
</header>

<main>
    <div class="bolum">
        <h3>Yeni Sulama Cihazı Ekle</h3>
        <p class="subtitle">Var olan bir bölgeye yeni sulama cihazı bağla. Cihaz durumlarını görmek/değiştirmek için Anasayfa'ya git.</p>
        <div class="form-grid">
            <div>
                <label>İlçe Seçiniz</label>
                <select id="districtSelect" onchange="onDistrictChange()">
                    <option value="">Önce İlçe Seçin...</option>
                </select>
            </div>
            <div>
                <label>Bölge Seçiniz</label>
                <select id="regionSelect" onchange="onRegionChange()" disabled>
                    <option value="">Önce İlçe Seçin...</option>
                </select>
            </div>
            <div>
                <label>Sulama Alanı Seçiniz</label>
                <select id="areaSelect" disabled>
                    <option value="">Önce Bölge Seçin...</option>
                </select>
            </div>
            <div>
                <label>Cihaz No</label>
                <input id="deviceNoInput" type="number" min="1">
            </div>
        </div>
        <button class="btn-ekle" onclick="addDevice()" style="margin-top: 16px;">Cihaz Ekle</button>
        <div class="basari-mesaji" id="deviceSuccess"></div>
    </div>
</main>

<script src="common.js"></script>
<script>
    requireLogin();
    requireAdmin();
    setupNav('cihazlar.html');
    loadRegionsIntoSelectors();

    let allRegions = []; // API'den gelen veriyi hafızada tutacağız

    async function loadRegionsIntoSelectors(){
        const districtSelector = document.getElementById('districtSelect');
        try{
            // API'den listeyi çek
            allRegions = await apiCall('/api/region/list');

            if(!allRegions || allRegions.length === 0){
                districtSelector.innerHTML = '<option>Önce bir bölge oluşturman gerekiyor</option>';
                return;
            }

            // Sadece benzersiz ilçe isimlerini filtrele
            const uniqueDistricts = [...new Set(allRegions.map(r => r.districtName))];

            districtSelector.innerHTML = '<option value="">İlçe Seçiniz...</option>' +
                uniqueDistricts.map(district => `<option value="${district}">${district}</option>`).join('');

        } catch(e){
            districtSelector.innerHTML = '<option>Bölge listesi yüklenemedi</option>';
        }
    }

    // İlçe seçildiğinde çalışacak fonksiyon
    function onDistrictChange() {
        const selectedDistrict = document.getElementById('districtSelect').value;
        const regionSelector = document.getElementById('regionSelect');
        const areaSelector = document.getElementById('areaSelect');

        // Alt kutuları sıfırla ve kilitle
        areaSelector.innerHTML = '<option value="">Önce Bölge Seçin...</option>';
        areaSelector.disabled = true;

        if (!selectedDistrict) {
            regionSelector.innerHTML = '<option value="">Önce İlçe Seçin...</option>';
            regionSelector.disabled = true;
            return;
        }

        // Seçilen ilçeye ait benzersiz bölgeleri bul
        const districtRegions = allRegions.filter(r => r.districtName === selectedDistrict);
        const uniqueRegions = [...new Set(districtRegions.map(r => r.regionName))];

        regionSelector.innerHTML = '<option value="">Bölge Seçiniz...</option>' +
            uniqueRegions.map(region => `<option value="${region}">${region}</option>`).join('');

        regionSelector.disabled = false; // Kilidi aç
    }

    // Bölge seçildiğinde çalışacak fonksiyon
    function onRegionChange() {
        const selectedDistrict = document.getElementById('districtSelect').value;
        const selectedRegion = document.getElementById('regionSelect').value;
        const areaSelector = document.getElementById('areaSelect');

        if (!selectedRegion) {
            areaSelector.innerHTML = '<option value="">Önce Bölge Seçin...</option>';
            areaSelector.disabled = true;
            return;
        }

        // Hem ilçesi hem bölgesi eşleşen sulama alanlarını bul
        const matchingAreas = allRegions.filter(r => r.districtName === selectedDistrict && r.regionName === selectedRegion);

        // Veritabanına kaydedilecek asıl "id" değeri burada "value" içine yazılır
        areaSelector.innerHTML = '<option value="">Sulama Alanı Seçiniz...</option>' +
            matchingAreas.map(area => `<option value="${area.id}">${area.irrigationAreaName}</option>`).join('');

        areaSelector.disabled = false; // Kilidi aç
    }

    async function addDevice(){
        const successBox = document.getElementById('deviceSuccess');
        successBox.style.display = 'none';

        // Artık regionId değerini en son seçilen Sulama Alanı kutusundan (areaSelect) alıyoruz
        const selectedAreaId = document.getElementById('areaSelect').value;
        const deviceNo = document.getElementById('deviceNoInput').value;

        if(!selectedAreaId) {
            alert("Lütfen bir sulama alanı seçin!");
            return;
        }
        if(!deviceNo) {
            alert("Lütfen cihaz numarasını girin!");
            return;
        }

        const body = {
            regionId: Number(selectedAreaId),
            deviceNo: Number(deviceNo)
        };

        try{
            await apiCall('/api/devices/save', {method:'POST', body: JSON.stringify(body)});
            successBox.textContent = 'Cihaz başarıyla eklendi.';
            successBox.style.display = 'block';

            // Formu temizle
            document.getElementById('deviceNoInput').value = '';
            document.getElementById('districtSelect').value = '';
            onDistrictChange(); // Alt kutuları tekrar sıfırlamak ve kilitlemek için tetikliyoruz

        } catch(e){
            alert('Cihaz eklenemedi: ' + e.message);
        }
    }
</script>
</body>
</html>
